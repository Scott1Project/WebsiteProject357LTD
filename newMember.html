<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">

    <script>
        function validateUser(){
            var x = document.forms["userForm"]["User"].value;
            if (x == ""){
                document.getElementById('errorUser').innerHTML = 'Please enter a username';
                return false;
            } else {
                document.getElementById('errorUser').innerHTML = '';
                return true;
            }
        }

        function validatePass(){
            var x = document.forms["userForm"]["Pass"].value;
            if (x == ""){
                document.getElementById('errorPassword').innerHTML = 'Please enter a password.';
                return false;
            } else {
                document.getElementById('errorPassword').innerHTML = '';
                return true;
            }
        }

        function validateEmail(){
            var x = document.forms["userForm"]["Email"].value;
            var atpos = x.indexOf("@");
            var dotpos = x.lastIndexOf(".");
            if (atpos < 1 || dotpos < atpos + 2 || dotpos + 2 >= x.length){
                document.getElementById('errorEmail').innerHTML = 'Please enter a valid email address.';
                return false;
            } else {
                document.getElementById('errorEmail').innerHTML = '';
                return true;
            }
        }
    </script>

</head>

<body>

<div class="navbar">
  <img src="img/logo.png" alt="357 LTD Logo">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="event.php">Events</a></li>
    <li><a href="store.php">Store</a></li>
  </ul>
</div>

<div class="box">

    <div class="logotitle">
        <h1 id="title">Create Account</h1>
    </div>

    <div class="loginbox">
        <form name="userForm" method="post" action="newMember.php"
              onsubmit="return validateUser() && validatePass() && validateEmail();">

            <div class="form-group">
                <label for="User">Username</label>
                <input id="User" name="User" type="text"
                       placeholder="Enter your username">
                <div id="errorUser" style="color:red; font-size:14px;"></div>
            </div>


            <div class="form-group">
                <label for="Pass">Password</label>
                <input id="Pass" name="Pass" type="password"
                       placeholder="Enter your password">
                <div id="errorPassword" style="color:red; font-size:14px;"></div>
            </div>
			<input type="submit" name="submit" value="Submit" id="LoginButton">

        </form>
    </div>

</div>

</body>
</html>
